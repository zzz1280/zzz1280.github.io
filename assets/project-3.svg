<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="数据可视化仪表板插图">
  <defs>
    <linearGradient id="p3g" gradientUnits="userSpaceOnUse" x1="200" y1="110" x2="600" y2="390">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="#0e1628"/>
  <circle cx="700" cy="90" r="160" fill="url(#p3g)" opacity=".10"/>
  <circle cx="90" cy="430" r="140" fill="url(#p3g)" opacity=".08"/>

  <!-- 仪表板面板 -->
  <rect x="200" y="110" width="400" height="280" rx="20" fill="#152238" stroke="#263650"/>

  <!-- KPI 小卡片 -->
  <rect x="232" y="142" width="104" height="46" rx="10" fill="#1d2c47"/>
  <circle cx="254" cy="165" r="8" fill="url(#p3g)"/>
  <rect x="270" y="158" width="52" height="8" rx="4" fill="#47597a"/>
  <rect x="270" y="172" width="36" height="7" rx="3.5" fill="#2c3b55"/>
  <rect x="348" y="142" width="104" height="46" rx="10" fill="#1d2c47"/>
  <circle cx="370" cy="165" r="8" fill="#22d3ee"/>
  <rect x="386" y="158" width="52" height="8" rx="4" fill="#47597a"/>
  <rect x="386" y="172" width="36" height="7" rx="3.5" fill="#2c3b55"/>

  <!-- 柱状图 -->
  <line x1="232" y1="352" x2="568" y2="352" stroke="#2c3b55" stroke-width="2"/>
  <rect x="248" y="290" width="34" height="62" rx="6" fill="url(#p3g)" opacity=".55"/>
  <rect x="304" y="252" width="34" height="100" rx="6" fill="url(#p3g)" opacity=".7"/>
  <rect x="360" y="304" width="34" height="48" rx="6" fill="url(#p3g)" opacity=".5"/>
  <rect x="416" y="222" width="34" height="130" rx="6" fill="url(#p3g)" opacity=".85"/>
  <rect x="472" y="266" width="34" height="86" rx="6" fill="url(#p3g)"/>

  <!-- 趋势折线 -->
  <polyline points="265,268 321,226 377,282 433,196 489,240"
            fill="none" stroke="#a7f3d0" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="265" cy="268" r="6" fill="#a7f3d0"/>
  <circle cx="321" cy="226" r="6" fill="#a7f3d0"/>
  <circle cx="377" cy="282" r="6" fill="#a7f3d0"/>
  <circle cx="433" cy="196" r="6" fill="#a7f3d0"/>
  <circle cx="489" cy="240" r="6" fill="#a7f3d0"/>
</svg>
